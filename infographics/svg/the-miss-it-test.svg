<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 993" width="1600" height="993" role="img" aria-label="Four boxes in a row: ship, give it away, take it away, ask: do they miss it? Two branches. If they shrug and go back to their day, you do not have a product yet. If they come back and ask for it, you have something, and two questions follow: is the price one they are happy to pay, and is that price profitable for you? A note above: before you ask whether a stranger misses it, ask whether you would." font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Ship it. Give it away. Take it away. Ask.</title>
<desc>Four boxes in a row: ship, give it away, take it away, ask: do they miss it? Two branches. If they shrug and go back to their day, you do not have a product yet. If they come back and ask for it, you have something, and two questions follow: is the price one they are happy to pay, and is that price profitable for you? A note above: before you ask whether a stranger misses it, ask whether you would.</desc>
<defs><marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 z" fill="#23262b"/></marker></defs>
<rect width="1600" height="993" fill="#fbf7ee"/>
<rect x="64" y="58" width="16" height="16" rx="2" fill="#7bc08f"/><rect x="86" y="58" width="16" height="16" rx="2" fill="#e8b64a"/><rect x="108" y="58" width="16" height="16" rx="2" fill="#3b9fb0"/><rect x="130" y="58" width="16" height="16" rx="2" fill="#e5625b"/><text x="164.0" y="72.0" font-size="17" fill="#1d5f6b" font-weight="700" letter-spacing="1.5"><tspan x="164.0" dy="0.0">CHAPTER 18 · SHIP IT, AND SEE IF THEY MISS IT</tspan></text><text x="64.0" y="144.0" font-size="50" fill="#0c2a3d" font-weight="700"><tspan x="64.0" dy="0.0">Ship it. Give it away. Take it away. Ask.</tspan></text><text x="64.0" y="189.0" font-size="25" fill="#5c5f66"><tspan x="64.0" dy="0.0">Then do whatever the answer tells you, including the thing you did not want to hear.</tspan></text>
<line x1="248.0" y1="434.2" x2="248.0" y2="490.8" stroke="#23262b" stroke-width="2.8" marker-end="url(#ah)"/><line x1="419.0" y1="561.0" x2="445.0" y2="561.0" stroke="#23262b" stroke-width="2.8" marker-end="url(#ah)"/><line x1="787.0" y1="561.0" x2="813.0" y2="561.0" stroke="#23262b" stroke-width="2.8" marker-end="url(#ah)"/><line x1="1155.0" y1="561.0" x2="1181.0" y2="561.0" stroke="#23262b" stroke-width="2.8" marker-end="url(#ah)"/><line x1="1352.0" y1="528.0" x2="1352.0" y2="423.1" stroke="#23262b" stroke-width="2.8" marker-end="url(#ah)"/><rect x="1275.3" y="460.5" width="153.3" height="28.0" rx="8" fill="#fbf7ee" stroke="none" stroke-width="0"/><text x="1352.0" y="480.5" font-size="17" fill="#23262b" font-style="italic" text-anchor="middle"><tspan x="1352.0" dy="0.0">no sense of loss</tspan></text><line x1="1352.0" y1="594.0" x2="1352.0" y2="698.9" stroke="#9c2f29" stroke-width="4" marker-end="url(#ah)"/><rect x="1296.8" y="631.5" width="110.4" height="28.0" rx="8" fill="#fbf7ee" stroke="none" stroke-width="0"/><text x="1352.0" y="651.5" font-size="17" fill="#9c2f29" font-style="italic" text-anchor="middle"><tspan x="1352.0" dy="0.0">a why now</tspan></text><line x1="1181.0" y1="761.0" x2="832.0" y2="761.0" stroke="#9c2f29" stroke-width="4" marker-end="url(#ah)"/><rect x="83.0" y="293.8" width="330.0" height="134.3" rx="14" fill="#ffffff" stroke="#e8b64a" stroke-width="3"/><text x="248.0" y="322.8" font-size="23" fill="#23262b" font-weight="700" text-anchor="middle"><tspan x="248.0" dy="0.0">First, ask whether you</tspan><tspan x="248.0" dy="28.1">would</tspan></text><text x="248.0" y="381.0" font-size="17" fill="#5c5f66" text-anchor="middle"><tspan x="248.0" dy="0.0">would you pick up your own tool on</tspan><tspan x="248.0" dy="22.1">Monday morning?</tspan></text><rect x="83.0" y="496.8" width="330.0" height="128.4" rx="14" fill="#ffffff" stroke="#3b9fb0" stroke-width="3"/><text x="248.0" y="525.8" font-size="23" fill="#23262b" font-weight="700" text-anchor="middle"><tspan x="248.0" dy="0.0">Ship it</tspan></text><text x="248.0" y="555.9" font-size="17" fill="#5c5f66" text-anchor="middle"><tspan x="248.0" dy="0.0">a thing somebody else can go and</tspan><tspan x="248.0" dy="22.1">use, on their own, and get value</tspan><tspan x="248.0" dy="22.1">from</tspan></text><rect x="451.0" y="518.9" width="330.0" height="84.2" rx="14" fill="#ffffff" stroke="#3b9fb0" stroke-width="3"/><text x="616.0" y="547.9" font-size="23" fill="#23262b" font-weight="700" text-anchor="middle"><tspan x="616.0" dy="0.0">Give it away</tspan></text><text x="616.0" y="578.0" font-size="17" fill="#5c5f66" text-anchor="middle"><tspan x="616.0" dy="0.0">free, for a short window</tspan></text><rect x="819.0" y="518.9" width="330.0" height="84.2" rx="14" fill="#ffffff" stroke="#3b9fb0" stroke-width="3"/><text x="984.0" y="547.9" font-size="23" fill="#23262b" font-weight="700" text-anchor="middle"><tspan x="984.0" dy="0.0">Take it away</tspan></text><text x="984.0" y="578.0" font-size="17" fill="#5c5f66" text-anchor="middle"><tspan x="984.0" dy="0.0">the trial ends; nothing else changes</tspan></text><rect x="1187.0" y="534.0" width="330.0" height="54.1" rx="14" fill="#0c2a3d" stroke="#0c2a3d" stroke-width="3"/><text x="1352.0" y="563.0" font-size="23" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="1352.0" dy="0.0">Ask: do they miss it?</tspan></text><rect x="1187.0" y="304.9" width="330.0" height="112.2" rx="14" fill="#ffffff" stroke="#e5625b" stroke-width="3"/><text x="1352.0" y="333.9" font-size="23" fill="#23262b" font-weight="700" text-anchor="middle"><tspan x="1352.0" dy="0.0">They shrug and go back</tspan><tspan x="1352.0" dy="28.1">to their day</tspan></text><text x="1352.0" y="392.0" font-size="17" fill="#5c5f66" text-anchor="middle"><tspan x="1352.0" dy="0.0">you do not have a product yet</tspan></text><rect x="1187.0" y="704.9" width="330.0" height="112.2" rx="14" fill="#ffffff" stroke="#7bc08f" stroke-width="3"/><text x="1352.0" y="733.9" font-size="23" fill="#23262b" font-weight="700" text-anchor="middle"><tspan x="1352.0" dy="0.0">They come back and</tspan><tspan x="1352.0" dy="28.1">ask for it</tspan></text><text x="1352.0" y="792.0" font-size="17" fill="#5c5f66" text-anchor="middle"><tspan x="1352.0" dy="0.0">you have something</tspan></text><rect x="406.0" y="707.9" width="420.0" height="106.3" rx="14" fill="#ffffff" stroke="#7bc08f" stroke-width="3"/><text x="616.0" y="736.9" font-size="23" fill="#23262b" font-weight="700" text-anchor="middle"><tspan x="616.0" dy="0.0">Then two questions</tspan></text><text x="616.0" y="766.9" font-size="17" fill="#5c5f66" text-anchor="middle"><tspan x="616.0" dy="0.0">Is the price one they are happy to pay? And is</tspan><tspan x="616.0" dy="22.1">that price profitable for you?</tspan></text>
<line x1="64" y1="899.0" x2="1536" y2="899.0" stroke="#d9d4c5" stroke-width="2"/><text x="64.0" y="931.0" font-size="17" fill="#5c5f66"><tspan x="64.0" dy="0.0">Source: chapter 18, Ship it, and see if they miss it (v2.0.0-rc2), from the newsroom's The question is whether</tspan><tspan x="64.0" dy="23.0">they miss it. One trap the chapter names: do not reach for a subscription by default.</tspan></text><text x="1536.0" y="931.0" font-size="17" fill="#9a9ca1" text-anchor="end"><tspan x="1536.0" dy="0.0">gen-z-developers.sgit.ai/infographics</tspan><tspan x="1536.0" dy="23.0">the-miss-it-test · drafted by code, not reviewed</tspan></text>
</svg>
