<title>Below about £5, the fixed fee is the price</title>
<desc>Four tiles. On a £20 payment the card fee is 2.5%. On £5 it is 5.5%. On 50p it is 41.5%. On 10p the fee is more than the payment. Below: payments of pence only work aggregated.</desc>
