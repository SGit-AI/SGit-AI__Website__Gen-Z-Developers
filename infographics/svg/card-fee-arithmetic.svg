<rect width="1600" height="606" fill="#fbf7ee"/>
<rect x="64" y="58" width="16" height="16" rx="2" fill="#7bc08f"/><rect x="86" y="58" width="16" height="16" rx="2" fill="#e8b64a"/><rect x="108" y="58" width="16" height="16" rx="2" fill="#3b9fb0"/><rect x="130" y="58" width="16" height="16" rx="2" fill="#e5625b"/><text x="164.0" y="72.0" font-size="17" fill="#1d5f6b" font-weight="700" letter-spacing="1.5"><tspan x="164.0" dy="0.0">CHAPTER 19 · PRICE IT, THEN GIVE IT AWAY</tspan></text><text x="64.0" y="144.0" font-size="50" fill="#0c2a3d" font-weight="700"><tspan x="64.0" dy="0.0">Below about £5, the fixed fee is the price</tspan></text><text x="64.0" y="189.0" font-size="25" fill="#5c5f66"><tspan x="64.0" dy="0.0">Stripe's standard UK card rate is 1.5% plus 20p. The same fee, on four payments.</tspan></text>
<rect x="64.0" y="231.0" width="344.0" height="173.5" rx="16" fill="#ffffff" stroke="#7bc08f" stroke-width="3"/><text x="84.0" y="311.0" font-size="58" fill="#2f6b40" font-weight="700"><tspan x="84.0" dy="0.0">2.5%</tspan></text><text x="84.0" y="342.0" font-size="23" fill="#23262b" font-weight="700"><tspan x="84.0" dy="0.0">of a £20 payment</tspan></text><text x="84.0" y="373.1" font-size="18" fill="#5c5f66"><tspan x="84.0" dy="0.0">a fee of 50p</tspan></text><rect x="440.0" y="231.0" width="344.0" height="173.5" rx="16" fill="#ffffff" stroke="#e8b64a" stroke-width="3"/><text x="460.0" y="311.0" font-size="58" fill="#7a5a12" font-weight="700"><tspan x="460.0" dy="0.0">5.5%</tspan></text><text x="460.0" y="342.0" font-size="23" fill="#23262b" font-weight="700"><tspan x="460.0" dy="0.0">of a £5 payment</tspan></text><text x="460.0" y="373.1" font-size="18" fill="#5c5f66"><tspan x="460.0" dy="0.0">a fee of 27.5p</tspan></text><rect x="816.0" y="231.0" width="344.0" height="173.5" rx="16" fill="#ffffff" stroke="#e5625b" stroke-width="3"/><text x="836.0" y="311.0" font-size="58" fill="#9c2f29" font-weight="700"><tspan x="836.0" dy="0.0">41.5%</tspan></text><text x="836.0" y="342.0" font-size="23" fill="#23262b" font-weight="700"><tspan x="836.0" dy="0.0">of a 50p payment</tspan></text><text x="836.0" y="373.1" font-size="18" fill="#5c5f66"><tspan x="836.0" dy="0.0">a fee of 20.75p</tspan></text><rect x="1192.0" y="231.0" width="344.0" height="173.5" rx="16" fill="#0c2a3d" stroke="#0c2a3d" stroke-width="3"/><text x="1212.0" y="311.0" font-size="58" fill="#ffffff" font-weight="700"><tspan x="1212.0" dy="0.0">&gt; 100%</tspan></text><text x="1212.0" y="342.0" font-size="23" fill="#ffffff" font-weight="700"><tspan x="1212.0" dy="0.0">of a 10p payment</tspan></text><text x="1212.0" y="373.1" font-size="18" fill="#cfe0ea"><tspan x="1212.0" dy="0.0">the fee is more than the payment</tspan></text><text x="64.0" y="448.5" font-size="20" fill="#5c5f66" font-style="italic"><tspan x="64.0" dy="0.0">So payments of pence only work aggregated: one charge a year that covers many things, or a platform that already holds a balance and settles in</tspan><tspan x="64.0" dy="25.0">bulk. The fees in pence are this drawing's arithmetic from the chapter's rate; recheck the rate and date it before print.</tspan></text>
