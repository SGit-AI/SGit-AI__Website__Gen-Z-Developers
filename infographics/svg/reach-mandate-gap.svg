<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1041" width="1600" height="1041" role="img" aria-label="A large box labelled reach, what the credential actually lets it touch, holds a smaller box, the mandate, what you authorised it to do. The rest of the reach is the gap, authority nobody ever accepted. Each capability in the gap points to its barrier, what actually stands in the way, which is one of four kinds: nothing, a rule written in the prompt, a setting the agent's own account can change, or a boundary enforced above the agent, out of its reach; only the last bounds anything." font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Reach, mandate, gap and barrier</title>
<desc>A large box labelled reach, what the credential actually lets it touch, holds a smaller box, the mandate, what you authorised it to do. The rest of the reach is the gap, authority nobody ever accepted. Each capability in the gap points to its barrier, what actually stands in the way, which is one of four kinds: nothing, a rule written in the prompt, a setting the agent's own account can change, or a boundary enforced above the agent, out of its reach; only the last bounds anything.</desc>
<defs><marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 z" fill="#23262b"/></marker></defs>
<rect width="1600" height="1041" fill="#fbf7ee"/>
<rect x="64" y="58" width="16" height="16" rx="2" fill="#7bc08f"/><rect x="86" y="58" width="16" height="16" rx="2" fill="#e8b64a"/><rect x="108" y="58" width="16" height="16" rx="2" fill="#3b9fb0"/><rect x="130" y="58" width="16" height="16" rx="2" fill="#e5625b"/><text x="164.0" y="72.0" font-size="17" fill="#1d5f6b" font-weight="700" letter-spacing="1.5"><tspan x="164.0" dy="0.0">CHAPTER 25 · CONTROLLING YOUR AGENT</tspan></text><text x="64.0" y="144.0" font-size="50" fill="#0c2a3d" font-weight="700"><tspan x="64.0" dy="0.0">Reach, mandate, gap and barrier</tspan></text><text x="64.0" y="189.0" font-size="25" fill="#5c5f66"><tspan x="64.0" dy="0.0">Before you give an agent access, write down four things. A control bounds a grant only if it is enforced by</tspan><tspan x="64.0" dy="33.0">something the grant does not include.</tspan></text>
<rect x="70.0" y="272.0" width="1092.0" height="554.0" rx="20" fill="#fbf0d6" stroke="#e8b64a" stroke-width="2"/><text x="456.0" y="302.0" font-size="17" fill="#7a5a12" font-weight="700" letter-spacing="1.2"><tspan x="456.0" dy="0.0">REACH: WHAT THE CREDENTIAL ACTUALLY LETS IT TOUCH</tspan></text><rect x="70.0" y="272.0" width="356.0" height="554.0" rx="20" fill="#e4f2e8" stroke="#7bc08f" stroke-width="2"/><line x1="782.0" y1="523.4" x2="1216.9" y2="417.0" stroke="#23262b" stroke-width="2.8" marker-end="url(#ah)"/><rect x="953.0" y="455.2" width="92.9" height="28.0" rx="8" fill="#fbf7ee" stroke="none" stroke-width="0"/><text x="999.5" y="475.2" font-size="17" fill="#23262b" font-style="italic" text-anchor="middle"><tspan x="999.5" dy="0.0">barrier?</tspan></text><line x1="782.0" y1="564.0" x2="1181.0" y2="564.0" stroke="#23262b" stroke-width="2.8" marker-end="url(#ah)"/><line x1="782.0" y1="604.6" x2="1181.0" y2="702.2" stroke="#9c2f29" stroke-width="4" marker-end="url(#ah)"/><rect x="108.0" y="521.9" width="280.0" height="84.2" rx="14" fill="#ffffff" stroke="#7bc08f" stroke-width="3"/><text x="248.0" y="550.9" font-size="23" fill="#23262b" font-weight="700" text-anchor="middle"><tspan x="248.0" dy="0.0">Mandate</tspan></text><text x="248.0" y="581.0" font-size="17" fill="#5c5f66" text-anchor="middle"><tspan x="248.0" dy="0.0">what you authorised it to do</tspan></text><rect x="456.0" y="341.9" width="320.0" height="84.2" rx="14" fill="#ffffff" stroke="#e5625b" stroke-width="3"/><text x="616.0" y="370.9" font-size="23" fill="#23262b" font-weight="700" text-anchor="middle"><tspan x="616.0" dy="0.0">The gap</tspan></text><text x="616.0" y="401.0" font-size="17" fill="#5c5f66" text-anchor="middle"><tspan x="616.0" dy="0.0">authority nobody ever accepted</tspan></text><rect x="456.0" y="507.9" width="320.0" height="112.2" rx="14" fill="#ffffff" stroke="#e5625b" stroke-width="3"/><text x="616.0" y="536.9" font-size="23" fill="#23262b" font-weight="700" text-anchor="middle"><tspan x="616.0" dy="0.0">Every capability in the</tspan><tspan x="616.0" dy="28.1">gap</tspan></text><text x="616.0" y="595.0" font-size="17" fill="#5c5f66" text-anchor="middle"><tspan x="616.0" dy="0.0">needs its barrier</tspan></text><rect x="456.0" y="679.8" width="320.0" height="128.4" rx="14" fill="#ffffff" stroke="#e8b64a" stroke-width="3"/><text x="616.0" y="708.8" font-size="23" fill="#23262b" font-weight="700" text-anchor="middle"><tspan x="616.0" dy="0.0">Add a connector</tspan></text><text x="616.0" y="738.9" font-size="17" fill="#5c5f66" text-anchor="middle"><tspan x="616.0" dy="0.0">the reach grows, the gap</tspan><tspan x="616.0" dy="22.1">recomputes and a re-review</tspan><tspan x="616.0" dy="22.1">follows</tspan></text><rect x="1187.0" y="357.0" width="330.0" height="54.1" rx="14" fill="#ffffff" stroke="#b9b4a6" stroke-width="3"/><text x="1352.0" y="386.0" font-size="23" fill="#23262b" font-weight="700" text-anchor="middle"><tspan x="1352.0" dy="0.0">Nothing</tspan></text><rect x="1187.0" y="507.9" width="330.0" height="112.2" rx="14" fill="#ffffff" stroke="#b9b4a6" stroke-width="3"/><text x="1352.0" y="536.9" font-size="23" fill="#23262b" font-weight="700" text-anchor="middle"><tspan x="1352.0" dy="0.0">A rule written in the</tspan><tspan x="1352.0" dy="28.1">prompt</tspan></text><text x="1352.0" y="595.0" font-size="17" fill="#5c5f66" text-anchor="middle"><tspan x="1352.0" dy="0.0">Rules in a prompt are hope</tspan></text><rect x="1187.0" y="676.8" width="330.0" height="134.3" rx="14" fill="#0c2a3d" stroke="#0c2a3d" stroke-width="3"/><text x="1352.0" y="705.8" font-size="23" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="1352.0" dy="0.0">A boundary enforced</tspan><tspan x="1352.0" dy="28.1">above the agent</tspan></text><text x="1352.0" y="764.0" font-size="17" fill="#cfe0ea" text-anchor="middle"><tspan x="1352.0" dy="0.0">out of its reach: the only one that</tspan><tspan x="1352.0" dy="22.1">bounds anything</tspan></text><text x="64.0" y="878.0" font-size="19" fill="#5c5f66" font-style="italic"><tspan x="64.0" dy="0.0">The fourth kind of barrier, between the prompt and the boundary: a setting the agent's own account can change. The goal is the smallest mandate, the smallest</tspan><tspan x="64.0" dy="25.7">reach, the smallest gap; the document with all four written down is the agent behaviour policy.</tspan></text>
<line x1="64" y1="947.3" x2="1536" y2="947.3" stroke="#d9d4c5" stroke-width="2"/><text x="64.0" y="979.3" font-size="17" fill="#5c5f66"><tspan x="64.0" dy="0.0">Source: chapter 25, Controlling your agent: RiskMandate (v2.0.0-rc2), from the newsroom's What can your</tspan><tspan x="64.0" dy="23.0">agent reach? and RiskMandate's ten questions.</tspan></text><text x="1536.0" y="979.3" font-size="17" fill="#9a9ca1" text-anchor="end"><tspan x="1536.0" dy="0.0">gen-z-developers.sgit.ai/infographics</tspan><tspan x="1536.0" dy="23.0">reach-mandate-gap · drafted by code, not reviewed</tspan></text>
</svg>
