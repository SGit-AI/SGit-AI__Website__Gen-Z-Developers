<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1073" width="1600" height="1073" role="img" aria-label="A loop of four steps around a centre that reads: small finished pieces beat one big review. One, I read an item. Two, I say what I think, in my own words. Three, I pick a verb from a short list: keep, fix, rewrite, merge, cut, article first, later, not doing it. Four, the editor records my comment word for word, turns the verb into a change in the working copy in the vault, and says where it went." font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>One loop</title>
<desc>A loop of four steps around a centre that reads: small finished pieces beat one big review. One, I read an item. Two, I say what I think, in my own words. Three, I pick a verb from a short list: keep, fix, rewrite, merge, cut, article first, later, not doing it. Four, the editor records my comment word for word, turns the verb into a change in the working copy in the vault, and says where it went.</desc>
