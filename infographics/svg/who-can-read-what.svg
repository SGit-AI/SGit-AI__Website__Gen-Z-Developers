<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 915" width="1600" height="915" role="img" aria-label="Two zones. On your machine: your files, and the keys, which stay with you. An arrow, encrypted before it leaves your machine, to the server, which holds ciphertext and nothing else: not your filenames, not your directory structure, not your commit messages. One object is 786 bytes of AES-256-GCM ciphertext named by the SHA-256 of the encrypted bytes, so the host can deduplicate it, cache it for a year and serve it from a CDN while remaining unable to tell you what it is. A note: there is no key escrow, no admin override and no support engineer who can recover it for you." font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Who can read what</title>
<desc>Two zones. On your machine: your files, and the keys, which stay with you. An arrow, encrypted before it leaves your machine, to the server, which holds ciphertext and nothing else: not your filenames, not your directory structure, not your commit messages. One object is 786 bytes of AES-256-GCM ciphertext named by the SHA-256 of the encrypted bytes, so the host can deduplicate it, cache it for a year and serve it from a CDN while remaining unable to tell you what it is. A note: there is no key escrow, no admin override and no support engineer who can recover it for you.</desc>
<defs><marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 z" fill="#23262b"/></marker></defs>
<rect width="1600" height="915" fill="#fbf7ee"/>
<rect x="64" y="58" width="16" height="16" rx="2" fill="#7bc08f"/><rect x="86" y="58" width="16" height="16" rx="2" fill="#e8b64a"/><rect x="108" y="58" width="16" height="16" rx="2" fill="#3b9fb0"/><rect x="130" y="58" width="16" height="16" rx="2" fill="#e5625b"/><text x="164.0" y="72.0" font-size="17" fill="#1d5f6b" font-weight="700" letter-spacing="1.5"><tspan x="164.0" dy="0.0">CHAPTER 24 · PRIVACY BY DESIGN</tspan></text><text x="64.0" y="144.0" font-size="50" fill="#0c2a3d" font-weight="700"><tspan x="64.0" dy="0.0">Who can read what</tspan></text><text x="64.0" y="189.0" font-size="25" fill="#5c5f66"><tspan x="64.0" dy="0.0">Everything is encrypted before it leaves your machine. The line stops being where the data is stored and</tspan><tspan x="64.0" dy="33.0">becomes who holds the keys.</tspan></text>
<rect x="70.0" y="272.0" width="478.7" height="454.0" rx="20" fill="#e4f2e8" stroke="#7bc08f" stroke-width="2"/><text x="88.0" y="302.0" font-size="17" fill="#2f6b40" font-weight="700" letter-spacing="1.2"><tspan x="88.0" dy="0.0">YOUR MACHINE</tspan></text><rect x="560.7" y="272.0" width="969.3" height="454.0" rx="20" fill="#eeece6" stroke="#b9b4a6" stroke-width="2" stroke-dasharray="8 6"/><text x="578.7" y="302.0" font-size="17" fill="#5c5f66" font-weight="700" letter-spacing="1.2"><tspan x="578.7" dy="0.0">THE SERVER</tspan></text><line x1="505.3" y1="404.0" x2="604.0" y2="404.0" stroke="#9c2f29" stroke-width="4" marker-end="url(#ah)"/><rect x="503.4" y="389.0" width="102.6" height="28.0" rx="8" fill="#fbf7ee" stroke="none" stroke-width="0"/><text x="554.7" y="409.0" font-size="17" fill="#9c2f29" font-style="italic" text-anchor="middle"><tspan x="554.7" dy="0.0">encrypted</tspan></text><line x1="996.0" y1="404.0" x2="1094.7" y2="404.0" stroke="#23262b" stroke-width="2.8" marker-end="url(#ah)"/><line x1="505.3" y1="624.0" x2="659.3" y2="624.0" stroke="#23262b" stroke-width="2.8" stroke-dasharray="10 8" marker-end="url(#ah)"/><rect x="119.3" y="350.9" width="380.0" height="106.3" rx="14" fill="#ffffff" stroke="#7bc08f" stroke-width="3"/><text x="309.3" y="379.9" font-size="23" fill="#23262b" font-weight="700" text-anchor="middle"><tspan x="309.3" dy="0.0">Your files</tspan></text><text x="309.3" y="409.9" font-size="17" fill="#5c5f66" text-anchor="middle"><tspan x="309.3" dy="0.0">filenames, directory structure, commit</tspan><tspan x="309.3" dy="22.1">messages</tspan></text><rect x="119.3" y="559.8" width="380.0" height="128.4" rx="14" fill="#0c2a3d" stroke="#0c2a3d" stroke-width="3"/><text x="309.3" y="588.8" font-size="23" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="309.3" dy="0.0">The keys</tspan></text><text x="309.3" y="618.9" font-size="17" fill="#cfe0ea" text-anchor="middle"><tspan x="309.3" dy="0.0">No key escrow, no admin override, no</tspan><tspan x="309.3" dy="22.1">support engineer who can recover it for</tspan><tspan x="309.3" dy="22.1">you</tspan></text><rect x="610.0" y="339.8" width="380.0" height="128.4" rx="14" fill="#ffffff" stroke="#b9b4a6" stroke-width="3"/><text x="800.0" y="368.8" font-size="23" fill="#23262b" font-weight="700" text-anchor="middle"><tspan x="800.0" dy="0.0">One object</tspan></text><text x="800.0" y="398.9" font-size="17" fill="#5c5f66" text-anchor="middle"><tspan x="800.0" dy="0.0">786 bytes of AES-256-GCM ciphertext,</tspan><tspan x="800.0" dy="22.1">named by the SHA-256 of the encrypted</tspan><tspan x="800.0" dy="22.1">bytes</tspan></text><rect x="1100.7" y="322.8" width="380.0" height="162.4" rx="14" fill="#ffffff" stroke="#b9b4a6" stroke-width="3"/><text x="1290.7" y="351.8" font-size="23" fill="#23262b" font-weight="700" text-anchor="middle"><tspan x="1290.7" dy="0.0">The host can deduplicate it,</tspan><tspan x="1290.7" dy="28.1">cache it for a year and</tspan><tspan x="1290.7" dy="28.1">serve it from a CDN</tspan></text><text x="1290.7" y="438.0" font-size="17" fill="#5c5f66" text-anchor="middle"><tspan x="1290.7" dy="0.0">while remaining unable to tell you what it</tspan><tspan x="1290.7" dy="22.1">is</tspan></text><rect x="665.3" y="581.9" width="760.0" height="84.2" rx="14" fill="#ffffff" stroke="#3b9fb0" stroke-width="3"/><text x="1045.3" y="610.9" font-size="23" fill="#23262b" font-weight="700" text-anchor="middle"><tspan x="1045.3" dy="0.0">What has to be protected</tspan></text><text x="1045.3" y="641.0" font-size="17" fill="#5c5f66" text-anchor="middle"><tspan x="1045.3" dy="0.0">not every copy, backup, log and replica, but the keys: a much smaller problem</tspan></text><text x="64.0" y="778.0" font-size="19" fill="#5c5f66" font-style="italic"><tspan x="64.0" dy="0.0">sgit is the author's own product, and in beta; the figures are from the newsroom's What sgit is, August 2026.</tspan></text>
<line x1="64" y1="821.65" x2="1536" y2="821.65" stroke="#d9d4c5" stroke-width="2"/><text x="64.0" y="853.6" font-size="17" fill="#5c5f66"><tspan x="64.0" dy="0.0">Source: chapter 24, Privacy by design: SG/Send, sgit, and the value of constraints (v2.0.0-rc2), from the</tspan><tspan x="64.0" dy="23.0">newsroom's What sgit is and No server by design.</tspan></text><text x="1536.0" y="853.6" font-size="17" fill="#9a9ca1" text-anchor="end"><tspan x="1536.0" dy="0.0">gen-z-developers.sgit.ai/infographics</tspan><tspan x="1536.0" dy="23.0">who-can-read-what · drafted by code, not reviewed</tspan></text>
</svg>
