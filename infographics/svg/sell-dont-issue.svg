<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 733" width="1600" height="733" role="img" aria-label="Arithmetic in four tiles: £2 million from the investor, minus about £420,000 in tax, leaves about £1.58 million; minus £0.75 million lent back to the company leaves about £0.83 million kept. Illustrative only; not legal, tax or investment advice; UK figures for one tax year." font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Sell, don't issue: a worked example</title>
<desc>Arithmetic in four tiles: £2 million from the investor, minus about £420,000 in tax, leaves about £1.58 million; minus £0.75 million lent back to the company leaves about £0.83 million kept. Illustrative only; not legal, tax or investment advice; UK figures for one tax year.</desc>
<defs><marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 z" fill="#23262b"/></marker></defs>
<rect width="1600" height="733" fill="#fbf7ee"/>
<rect x="64" y="58" width="16" height="16" rx="2" fill="#7bc08f"/><rect x="86" y="58" width="16" height="16" rx="2" fill="#e8b64a"/><rect x="108" y="58" width="16" height="16" rx="2" fill="#3b9fb0"/><rect x="130" y="58" width="16" height="16" rx="2" fill="#e5625b"/><text x="164.0" y="72.0" font-size="17" fill="#1d5f6b" font-weight="700" letter-spacing="1.5"><tspan x="164.0" dy="0.0">CHAPTER 21 · FUND IT, OR DO NOT</tspan></text><text x="64.0" y="144.0" font-size="50" fill="#0c2a3d" font-weight="700"><tspan x="64.0" dy="0.0">Sell, don't issue: a worked example</tspan></text><text x="64.0" y="189.0" font-size="25" fill="#5c5f66"><tspan x="64.0" dy="0.0">A UK company worth £10 million, a founder who owns all of it, an investor writing £2 million. The founder</tspan><tspan x="64.0" dy="33.0">keeps 80% either way; in this model the investor buys 20% of the founder's shares.</tspan></text>
<rect x="64.0" y="264.0" width="320.0" height="267.1" rx="16" fill="#ffffff" stroke="#3b9fb0" stroke-width="3"/><text x="84.0" y="344.0" font-size="58" fill="#1d5f6b" font-weight="700"><tspan x="84.0" dy="0.0">£2m</tspan></text><text x="84.0" y="375.0" font-size="23" fill="#23262b" font-weight="700"><tspan x="84.0" dy="0.0">paid to the founder</tspan></text><text x="84.0" y="406.1" font-size="18" fill="#5c5f66"><tspan x="84.0" dy="0.0">for 20% of the founder's</tspan><tspan x="84.0" dy="23.4">shares</tspan></text><rect x="448.0" y="264.0" width="320.0" height="267.1" rx="16" fill="#ffffff" stroke="#e5625b" stroke-width="3"/><text x="468.0" y="344.0" font-size="58" fill="#9c2f29" font-weight="700"><tspan x="468.0" dy="0.0">£420k</tspan></text><text x="468.0" y="375.0" font-size="23" fill="#23262b" font-weight="700"><tspan x="468.0" dy="0.0">about, in tax</tspan></text><text x="468.0" y="406.1" font-size="18" fill="#5c5f66"><tspan x="468.0" dy="0.0">18% on the first £1 million</tspan><tspan x="468.0" dy="23.4">under Business Asset Disposal</tspan><tspan x="468.0" dy="23.4">Relief from 6 April 2026, if its</tspan><tspan x="468.0" dy="23.4">conditions are met, and 24%</tspan><tspan x="468.0" dy="23.4">above</tspan></text><text x="416.0" y="415.5" font-size="52" fill="#23262b" font-weight="700" text-anchor="middle"><tspan x="416.0" dy="0.0">−</tspan></text><rect x="832.0" y="264.0" width="320.0" height="267.1" rx="16" fill="#ffffff" stroke="#e8b64a" stroke-width="3"/><text x="852.0" y="344.0" font-size="58" fill="#7a5a12" font-weight="700"><tspan x="852.0" dy="0.0">£0.75m</tspan></text><text x="852.0" y="375.0" font-size="23" fill="#23262b" font-weight="700"><tspan x="852.0" dy="0.0">lent back</tspan></text><text x="852.0" y="406.1" font-size="18" fill="#5c5f66"><tspan x="852.0" dy="0.0">to the company</tspan></text><text x="800.0" y="415.5" font-size="52" fill="#23262b" font-weight="700" text-anchor="middle"><tspan x="800.0" dy="0.0">−</tspan></text><rect x="1216.0" y="264.0" width="320.0" height="267.1" rx="16" fill="#0c2a3d" stroke="#0c2a3d" stroke-width="3"/><text x="1236.0" y="344.0" font-size="58" fill="#ffffff" font-weight="700"><tspan x="1236.0" dy="0.0">£0.83m</tspan></text><text x="1236.0" y="375.0" font-size="23" fill="#ffffff" font-weight="700"><tspan x="1236.0" dy="0.0">about, kept</tspan></text><text x="1236.0" y="406.1" font-size="18" fill="#cfe0ea"><tspan x="1236.0" dy="0.0">after tax and the loan; the buyer</tspan><tspan x="1236.0" dy="23.4">pays 0.5% stamp duty</tspan></text><text x="1184.0" y="415.5" font-size="52" fill="#23262b" font-weight="700" text-anchor="middle"><tspan x="1184.0" dy="0.0">=</tspan></text><text x="64.0" y="575.1" font-size="20" fill="#5c5f66" font-style="italic"><tspan x="64.0" dy="0.0">Illustrative only: not legal, tax or investment advice; the UK figures are for one tax year and other countries differ. After tax and before the loan, about</tspan><tspan x="64.0" dy="25.0">£1.58 million.</tspan></text>
<line x1="64" y1="639.06" x2="1536" y2="639.06" stroke="#d9d4c5" stroke-width="2"/><text x="64.0" y="671.1" font-size="17" fill="#5c5f66"><tspan x="64.0" dy="0.0">Source: chapter 21, Fund it, or do not (v2.0.0-rc2), from the newsroom's Sell, don't issue. Check: 18% of £1m</tspan><tspan x="64.0" dy="23.0">plus 24% of £1m is £420,000; £2m less that is £1.58m; less £0.75m is £0.83m.</tspan></text><text x="1536.0" y="671.1" font-size="17" fill="#9a9ca1" text-anchor="end"><tspan x="1536.0" dy="0.0">gen-z-developers.sgit.ai/infographics</tspan><tspan x="1536.0" dy="23.0">sell-dont-issue · drafted by code, not reviewed</tspan></text>
</svg>
