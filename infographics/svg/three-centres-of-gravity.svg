<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" role="img" aria-label="Three columns. The explorer is bursting with ideas, sees failure as just an experiment, makes a prototype for early adopters, and reads explorer coding and building fast with agents first. The villager loves the user, does not like failure that much, packages and releases, and reads shipping, selling and your own newsroom first. The town planner geeks out on the details, likes to be invisible, makes something a commodity, and reads controlling your agent, the record, serverless for real and reading code as a graph first." font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Explorer, villager, town planner</title>
<desc>Three columns. The explorer is bursting with ideas, sees failure as just an experiment, makes a prototype for early adopters, and reads explorer coding and building fast with agents first. The villager loves the user, does not like failure that much, packages and releases, and reads shipping, selling and your own newsroom first. The town planner geeks out on the details, likes to be invisible, makes something a commodity, and reads controlling your agent, the record, serverless for real and reading code as a graph first.</desc>
<defs><marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 z" fill="#23262b"/></marker></defs>
<rect width="1600" height="1100" fill="#fbf7ee"/>
<rect x="64" y="58" width="16" height="16" rx="2" fill="#7bc08f"/><rect x="86" y="58" width="16" height="16" rx="2" fill="#e8b64a"/><rect x="108" y="58" width="16" height="16" rx="2" fill="#3b9fb0"/><rect x="130" y="58" width="16" height="16" rx="2" fill="#e5625b"/><text x="164.0" y="72.0" font-size="17" fill="#1d5f6b" font-weight="700" letter-spacing="1.5"><tspan x="164.0" dy="0.0">CHAPTER 4 · WHERE DO YOU LAND?</tspan></text><text x="64.0" y="144.0" font-size="50" fill="#0c2a3d" font-weight="700"><tspan x="64.0" dy="0.0">Explorer, villager, town planner</tspan></text><text x="64.0" y="189.0" font-size="25" fill="#5c5f66"><tspan x="64.0" dy="0.0">The test: What do you care about? What makes you lose your sense of time? All three are brilliant.</tspan></text>
<rect x="64.0" y="231.0" width="472.0" height="676.3" rx="18" fill="#dceef2" stroke="#3b9fb0" stroke-width="2.5"/><text x="86.0" y="275.0" font-size="30" fill="#1d5f6b" font-weight="700"><tspan x="86.0" dy="0.0">The explorer</tspan></text><text x="86.0" y="308.6" font-size="19" fill="#5c5f66"><tspan x="86.0" dy="0.0">the compass</tspan></text><rect x="82.0" y="334.3" width="436.0" height="110.1" rx="10" fill="#ffffff" stroke="#cfcabb" stroke-width="1.6"/><text x="104.0" y="364.3" font-size="24" fill="#23262b" font-weight="700"><tspan x="104.0" dy="0.0">Bursting with ideas</tspan></text><text x="104.0" y="395.6" font-size="18" fill="#5c5f66"><tspan x="104.0" dy="0.0">They are not the person playing with the</tspan><tspan x="104.0" dy="23.4">Lego; they want to invent the bricks.</tspan></text><rect x="82.0" y="458.4" width="436.0" height="110.1" rx="10" fill="#ffffff" stroke="#cfcabb" stroke-width="1.6"/><text x="104.0" y="488.4" font-size="24" fill="#23262b" font-weight="700"><tspan x="104.0" dy="0.0">Failure is exciting</tspan></text><text x="104.0" y="519.7" font-size="18" fill="#5c5f66"><tspan x="104.0" dy="0.0">because failure is just an experiment</tspan></text><rect x="82.0" y="582.5" width="436.0" height="139.4" rx="10" fill="#ffffff" stroke="#cfcabb" stroke-width="1.6"/><text x="104.0" y="612.5" font-size="24" fill="#23262b" font-weight="700"><tspan x="104.0" dy="0.0">Makes a prototype</tspan></text><text x="104.0" y="643.7" font-size="18" fill="#5c5f66"><tspan x="104.0" dy="0.0">What they make only works for early</tspan><tspan x="104.0" dy="23.4">adopters, because it is going to break</tspan></text><rect x="82.0" y="735.8" width="436.0" height="133.5" rx="10" fill="#ffffff" stroke="#cfcabb" stroke-width="1.6"/><text x="104.0" y="765.8" font-size="24" fill="#23262b" font-weight="700"><tspan x="104.0" dy="0.0">Read early</tspan></text><text x="104.0" y="797.1" font-size="18" fill="#5c5f66"><tspan x="104.0" dy="0.0">explorer coding, and building fast with</tspan><tspan x="104.0" dy="23.4">agents</tspan></text><rect x="564.0" y="231.0" width="472.0" height="676.3" rx="18" fill="#e4f2e8" stroke="#7bc08f" stroke-width="2.5"/><text x="586.0" y="275.0" font-size="30" fill="#2f6b40" font-weight="700"><tspan x="586.0" dy="0.0">The villager</tspan></text><text x="586.0" y="308.6" font-size="19" fill="#5c5f66"><tspan x="586.0" dy="0.0">the house</tspan></text><rect x="582.0" y="334.3" width="436.0" height="110.1" rx="10" fill="#ffffff" stroke="#cfcabb" stroke-width="1.6"/><text x="604.0" y="364.3" font-size="24" fill="#23262b" font-weight="700"><tspan x="604.0" dy="0.0">Loves the user</tspan></text><text x="604.0" y="395.6" font-size="18" fill="#5c5f66"><tspan x="604.0" dy="0.0">they put themselves in the middle of the</tspan><tspan x="604.0" dy="23.4">problem and solve it</tspan></text><rect x="582.0" y="458.4" width="436.0" height="110.1" rx="10" fill="#ffffff" stroke="#cfcabb" stroke-width="1.6"/><text x="604.0" y="488.4" font-size="24" fill="#23262b" font-weight="700"><tspan x="604.0" dy="0.0">Does not like failure that much</tspan></text><text x="604.0" y="519.7" font-size="18" fill="#5c5f66"><tspan x="604.0" dy="0.0">because for them the product has to work</tspan></text><rect x="582.0" y="582.5" width="436.0" height="139.4" rx="10" fill="#ffffff" stroke="#cfcabb" stroke-width="1.6"/><text x="604.0" y="612.5" font-size="24" fill="#23262b" font-weight="700"><tspan x="604.0" dy="0.0">Packaging, releasing, going to</tspan><tspan x="604.0" dy="29.3">market</tspan></text><text x="604.0" y="673.0" font-size="18" fill="#5c5f66"><tspan x="604.0" dy="0.0">the first version just has to work; the second</tspan><tspan x="604.0" dy="23.4">version has to be designed</tspan></text><rect x="582.0" y="735.8" width="436.0" height="133.5" rx="10" fill="#ffffff" stroke="#cfcabb" stroke-width="1.6"/><text x="604.0" y="765.8" font-size="24" fill="#23262b" font-weight="700"><tspan x="604.0" dy="0.0">Read early</tspan></text><text x="604.0" y="797.1" font-size="18" fill="#5c5f66"><tspan x="604.0" dy="0.0">shipping, selling, and your own newsroom</tspan></text><rect x="1064.0" y="231.0" width="472.0" height="676.3" rx="18" fill="#dfe6ec" stroke="#0c2a3d" stroke-width="2.5"/><text x="1086.0" y="275.0" font-size="30" fill="#0c2a3d" font-weight="700"><tspan x="1086.0" dy="0.0">The town planner</tspan></text><text x="1086.0" y="308.6" font-size="19" fill="#5c5f66"><tspan x="1086.0" dy="0.0">the grid</tspan></text><rect x="1082.0" y="334.3" width="436.0" height="110.1" rx="10" fill="#ffffff" stroke="#cfcabb" stroke-width="1.6"/><text x="1104.0" y="364.3" font-size="24" fill="#23262b" font-weight="700"><tspan x="1104.0" dy="0.0">Geeks out on the details</tspan></text><text x="1104.0" y="395.6" font-size="18" fill="#5c5f66"><tspan x="1104.0" dy="0.0">boring is good</tspan></text><rect x="1082.0" y="458.4" width="436.0" height="110.1" rx="10" fill="#ffffff" stroke="#cfcabb" stroke-width="1.6"/><text x="1104.0" y="488.4" font-size="24" fill="#23262b" font-weight="700"><tspan x="1104.0" dy="0.0">Likes to be invisible</tspan></text><text x="1104.0" y="519.7" font-size="18" fill="#5c5f66"><tspan x="1104.0" dy="0.0">they know they have done the job right when</tspan><tspan x="1104.0" dy="23.4">nothing goes wrong</tspan></text><rect x="1082.0" y="582.5" width="436.0" height="139.4" rx="10" fill="#ffffff" stroke="#cfcabb" stroke-width="1.6"/><text x="1104.0" y="612.5" font-size="24" fill="#23262b" font-weight="700"><tspan x="1104.0" dy="0.0">Making something a commodity</tspan></text><text x="1104.0" y="643.7" font-size="18" fill="#5c5f66"><tspan x="1104.0" dy="0.0">which is still hard</tspan></text><rect x="1082.0" y="735.8" width="436.0" height="133.5" rx="10" fill="#ffffff" stroke="#cfcabb" stroke-width="1.6"/><text x="1104.0" y="765.8" font-size="24" fill="#23262b" font-weight="700"><tspan x="1104.0" dy="0.0">Read early</tspan></text><text x="1104.0" y="797.1" font-size="18" fill="#5c5f66"><tspan x="1104.0" dy="0.0">controlling your agent, the record,</tspan><tspan x="1104.0" dy="23.4">serverless for real, and reading code as a</tspan><tspan x="1104.0" dy="23.4">graph</tspan></text><text x="64.0" y="947.3" font-size="19" fill="#5c5f66" font-style="italic"><tspan x="64.0" dy="0.0">This is a lens, not a label. As your career changes, your centre can move with it. Wardley named them pioneers, settlers and town planners in 2015, and</tspan><tspan x="64.0" dy="23.8">since 2023 explorers, villagers and town planners.</tspan></text>
<line x1="64" y1="1006.8" x2="1536" y2="1006.8" stroke="#d9d4c5" stroke-width="2"/><text x="64.0" y="1038.8" font-size="17" fill="#5c5f66"><tspan x="64.0" dy="0.0">Source: chapter 4, Where do you land? (v2.0.0-rc2), after Simon Wardley's pioneers, settlers and town</tspan><tspan x="64.0" dy="23.0">planners, and the 2018 outline. The compass, house and grid are the chapter's badges, a first attempt.</tspan></text><text x="1536.0" y="1038.8" font-size="17" fill="#9a9ca1" text-anchor="end"><tspan x="1536.0" dy="0.0">gen-z-developers.sgit.ai/infographics</tspan><tspan x="1536.0" dy="23.0">three-centres-of-gravity · drafted by code, not reviewed</tspan></text>
</svg>
